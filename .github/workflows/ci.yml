name: CI Pipeline

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

# Concurrency group cancels redundant in-progress runs on the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Explicit minimal permissions (least privilege security principle)
permissions:
  contents: read

jobs:
  lint-and-format:
    name: Code Quality (Ruff & Conventional Commits)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Linting & Pre-commit Tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff conventional-pre-commit pre-commit

      - name: Run Ruff Linter (ESLint Alternative)
        run: ruff check .

      - name: Run Ruff Formatter Check (Prettier Alternative)
        run: ruff format --check .

      - name: Validate PR Commit Messages (Commitlint Alternative)
        if: github.event_name == 'pull_request'
        run: |
          conventional-pre-commit \
            feat fix docs style refactor perf test build ci chore revert \
            "${{ github.event.pull_request.title }}"

  test:
    name: Automated Test Suite (Pytest & Coverage)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [lint-and-format]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Application & Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Pytest with Coverage
        run: |
          pytest --cov=app --cov-report=xml --cov-report=term-missing

      - name: Upload Test Coverage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 14

  security-scan:
    name: Security Vulnerability Scan (Bandit & pip-audit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [lint-and-format]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Security Tools
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Bandit AST Security Analysis
        run: bandit -c pyproject.toml -r src

      - name: Run Pip-Audit Dependency Vulnerability Check
        run: pip-audit

  docker-build:
    name: Docker Image Build Validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [lint-and-format]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API and Frontend Images
        run: |
          docker compose build api frontend
