# See https://pre-commit.com for more information
# Pre-commit configuration for Python-native linting, formatting, git hooks, and security

default_stages: [pre-commit]
minimum_pre_commit_version: "3.5.0"

repos:
  # 1. Standard file sanitization and hygiene
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        exclude: ^(docker-compose.*\.yml)$
      - id: check-json
      - id: check-toml
      - id: check-added-large-files
        args: ["--maxkb=1500"]
      - id: check-merge-conflict
      - id: debug-statements

  # 2. Python Linter (ESLint alternative: 100x faster, rule-based)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.9
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      # 3. Python Formatter (Prettier / Black alternative)
      - id: ruff-format

  # 4. Commit Message Linter (Commitlint alternative: validates conventional commits)
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.0.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: [
          "feat",
          "fix",
          "docs",
          "style",
          "refactor",
          "perf",
          "test",
          "build",
          "ci",
          "chore",
          "revert",
        ]

  # 5. Python Security Vulnerability Static Analysis (SAST)
  - repo: https://github.com/PyCQA/bandit
    rev: 1.8.3
    hooks:
      - id: bandit
        args: ["-c", "pyproject.toml", "-r", "src"]
        additional_dependencies: ["bandit[toml]"]
