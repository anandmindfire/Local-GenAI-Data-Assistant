networks:
  genai-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  qdrant_data:
    driver: local
  ollama_data:
    driver: local

services:
  postgres:
    image: postgres:16-alpine
    container_name: genai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: genai_db
      POSTGRES_USER: genai_admin
      POSTGRES_PASSWORD: genai_secret_password
      POSTGRES_READONLY_USER: genai_readonly
      POSTGRES_READONLY_PASSWORD: readonly_secret_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    networks:
      - genai-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U genai_admin -d genai_db"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  qdrant:
    image: qdrant/qdrant:v1.12.0
    container_name: genai-qdrant
    restart: unless-stopped
    volumes:
      - qdrant_data:/qdrant/storage
    ports:
      - "6333:6333"
      - "6334:6334"
    networks:
      - genai-network
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'cat < /dev/null > /dev/tcp/localhost/6333' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  ollama:
    image: ollama/ollama:latest
    container_name: genai-ollama
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    networks:
      - genai-network
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: genai-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      ollama:
        condition: service_healthy
    environment:
      APP_NAME: local-genai-assistant
      APP_ENV: production
      LOG_LEVEL: INFO
      HOST: 0.0.0.0
      PORT: 8000
      API_PREFIX: /api/v1
      OLLAMA_BASE_URL: http://ollama:11434
      CHAT_MODEL: qwen3:1.7b
      EMBEDDING_MODEL: nomic-embed-text
      LLM_TEMPERATURE: 0.0
      LLM_TIMEOUT: 120
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      QDRANT_COLLECTION: documents
      EMBEDDING_DIMENSION: 768
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: genai_db
      POSTGRES_USER: genai_admin
      POSTGRES_PASSWORD: genai_secret_password
      POSTGRES_READONLY_USER: genai_readonly
      POSTGRES_READONLY_PASSWORD: readonly_secret_password
      DOCUMENTS_DIRECTORY: /app/data/documents
    volumes:
      - ./src:/app/src
      - ./data:/app/data
    ports:
      - "8000:8000"
    networks:
      - genai-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/v1/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
