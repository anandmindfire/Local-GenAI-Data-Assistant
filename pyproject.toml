[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "local-genai-assistant"
version = "0.1.0"
description = "Local GenAI Data Assistant using FastAPI, LangChain, LangGraph, Ollama, Qdrant, and PostgreSQL"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Local GenAI Team" }]

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy>=2.0.35",
    "greenlet>=3.1.0",
    "asyncpg>=0.30.0",
    "psycopg2-binary>=2.9.10",
    "alembic>=1.14.0",
    "qdrant-client>=1.12.0",
    "sqlglot>=25.20.0",
    "pymupdf>=1.25.0",
    "python-docx>=1.1.2",
    "langchain>=0.3.7",
    "langchain-core>=0.3.15",
    "langchain-community>=0.3.7",
    "langchain-ollama>=0.2.0",
    "langchain-text-splitters>=0.3.2",
    "langgraph>=0.2.45",
    "httpx>=0.27.2",
    "python-multipart>=0.0.17",
    "streamlit>=1.40.0",
    "pandas>=2.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "pytest-mock>=3.14.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.7.0",
    "aiosqlite>=0.20.0",
    "pre-commit>=4.0.0",
    "conventional-pre-commit>=0.3.4",
    "bandit>=1.7.10",
    "pip-audit>=2.7.3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4"]
ignore = ["B008", "N818", "UP046", "E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src", "."]
python_files = ["test_*.py"]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
skips = ["B101", "B104"]
